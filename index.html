<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Force unregister Service Worker in development to prevent caching/MIME-type deadlocks
      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname === 'localhost' || window.location.hostname.includes('run.app');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            let unregistered = false;
            for (const registration of registrations) {
              registration.unregister();
              console.log('[Dev] Unregistered active ServiceWorker:', registration.scope);
              unregistered = true;
            }
            if (unregistered) {
              console.log('[Dev] Service Worker was active and unregistered. Reloading page...');
              window.location.reload();
            }
          });
        }
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoicePe - Simple GST Billing for Indian Shops</title>
    <meta name="description" content="Create GST invoices, manage udhaar, share bills on WhatsApp and grow your business with InvoicePe." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#FF6B00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InvoicePe" />
    
    <!-- Google Fonts Poppins and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA & Favorite Icons -->
    <link rel="icon" type="image/png" href="/favicon.ico?v=12" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=12" />
    <link rel="manifest" href="/manifest.json?v=12" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
